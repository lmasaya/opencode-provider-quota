name: Release

# Publishes to npm with trusted publishing (OIDC): no npm token is stored
# anywhere. The trusted publisher on npmjs.com is bound to this exact file
# name (release.yml), so renaming it requires updating that configuration.
on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Tag matches package.json and is on main
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version v$version"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tagged commit $GITHUB_SHA is not on main"
            exit 1
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Read Bun version from mise.toml
        id: bun
        run: echo "version=$(sed -n 's/^bun = "\(.*\)"$/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.bun.outputs.version }}

      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run test:ui
      - run: npm run build

      - name: Committed dist/ matches the source
        run: git diff --exit-code -- dist

      - run: npm audit --audit-level=high
      - run: npm audit signatures

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # id-token is granted only to this job, which installs no dependencies and
    # runs no project scripts: it publishes the files verified above.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: npm supports trusted publishing (>= 11.5.1)
        run: |
          set -euo pipefail
          current=$(npm --version)
          lowest=$(printf '%s\n' 11.5.1 "$current" | sort -V | head -n1)
          if [ "$lowest" != "11.5.1" ]; then
            echo "::error::npm $current is older than 11.5.1, which trusted publishing requires"
            exit 1
          fi

      # Provenance is generated automatically for trusted publishing from a
      # public repository.
      - run: npm publish
