name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      # mise.toml is the single source of truth for the Bun version.
      - name: Read Bun version from mise.toml
        id: bun
        run: echo "version=$(sed -n 's/^bun = "\(.*\)"$/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.bun.outputs.version }}

      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm run test:ui
      - run: npm run build

      - name: Committed dist/ matches the source
        run: git diff --exit-code -- dist

      - run: npm audit --audit-level=high
      - run: npm audit signatures
